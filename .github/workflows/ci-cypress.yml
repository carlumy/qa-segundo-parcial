name: CI - Cypress

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'          # usa el package-lock.json que ya agregaste

      - name: Info de Node y npm
        run: |
          node -v
          npm -v

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Verificar Cypress
        run: npx cypress verify

      - name: Ejecutar Cypress (sanity)
        run: npx cypress run --spec cypress/e2e/sanity.cy.js

      # (Opcional) si falla, sube videos/screenshots como artefactos
      - name: Subir artefactos (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/videos/**
            cypress/screenshots/**
