name: CI – Cypress

on:
  push:
    branches: [ "feat/config-tests" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps (incluye devDependencies)
        run: npm ci
        env:
          # Evita que npm omita devDependencies
          NODE_ENV: ""

      - name: Verify Cypress
        run: npx cypress verify

      - name: Run Cypress E2E (config explícito)
        run: npx cypress run --project . --config-file cypress.config.js --spec cypress/e2e/sanity.cy.js
        env:
          BASE_URL: https://example.cypress.io
